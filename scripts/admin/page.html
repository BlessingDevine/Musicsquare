<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squaredrum Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a studio desk. Jobs sit in a rail on the left like labelled channel strips; the chosen job is the
   faceplate on the right: what it does, its controls, then the transport (Preview arms it, Do it records it,
   like a tape machine) and the log underneath. Michroma is the face on the compilation series tiles. */
:root{
  --desk:#e3e6e1; --plate:#f4f5f2; --well:#eceee9; --ink:#1c2321; --mute:#5c6561; --line:#c9cec8; --line-2:#d8dcd6;
  --amber:#c9820f; --amber-glow:#f2b33d; --amber-soft:#f6e7c8;
  --rec:#c8352a; --rec-glow:#ff5a4a; --rec-soft:#f5dcd8;
  --go:#2b7d4f; --go-soft:#d9ecdf;
  --tape:#1a1f1d; --tape-fg:#d9e1dc; --tape-dim:#7f8b85;
  --shadow:0 1px 0 #ffffff inset, 0 1px 2px rgb(28 35 33 / .08);
  --silk:"Michroma","Eurostile","Arial",sans-serif;
  --body:"Instrument Sans",-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --desk:#141817; --plate:#1c211f; --well:#171b1a; --ink:#e4e9e5; --mute:#97a29c; --line:#323a37; --line-2:#29302d;
  --amber:#e8a332; --amber-glow:#ffc861; --amber-soft:#3a2e17;
  --rec:#ef5b4d; --rec-glow:#ff7a6c; --rec-soft:#3b1d1a;
  --go:#6cc58f; --go-soft:#183024;
  --tape:#0d100f; --tape-fg:#d9e1dc; --tape-dim:#6b7671;
  --shadow:0 1px 0 rgb(255 255 255 / .04) inset, 0 1px 2px rgb(0 0 0 / .4);
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);height:100%}

/* --- rail --- */
aside{background:var(--plate);border-right:1px solid var(--line);padding:22px 14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:22px}
.brand{padding:0 8px;display:grid;gap:8px}
.brand .mark{font-family:var(--silk);font-size:15px;letter-spacing:.06em;text-transform:uppercase;line-height:1.25}
.brand .sub{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--mute)}
.led{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none;box-shadow:inset 0 1px 1px rgb(0 0 0 / .2)}
.led.on{background:var(--go);box-shadow:0 0 0 3px var(--go-soft)}
#nav{display:grid;gap:20px}
.group b{display:block;font-family:var(--silk);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:400;margin:0 0 6px 10px}
.group button{position:relative;display:block;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:7px 10px 7px 22px;cursor:pointer;color:var(--ink)}
.group button::before{content:"";position:absolute;left:9px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--line)}
.group button:hover{background:var(--well)}
.group button[aria-current="true"]{background:var(--ink);color:var(--plate)}
.group button[aria-current="true"]::before{background:var(--amber-glow);box-shadow:0 0 6px var(--amber-glow)}
.quit{margin-top:auto;background:none;border:1px solid var(--line);border-radius:7px;padding:9px;cursor:pointer;color:var(--mute);font-size:13.5px}
.quit:hover{border-color:var(--rec);color:var(--rec)}

/* --- faceplate --- */
main{overflow-y:auto;padding:30px clamp(16px,4vw,52px) 52px;display:flex;flex-direction:column;gap:16px;min-width:0}
.eyebrow{font-family:var(--silk);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);margin:0}
h1{font-family:var(--body);font-weight:600;font-size:clamp(26px,3.2vw,34px);letter-spacing:-.015em;line-height:1.1;margin:0}
.what{color:var(--mute);margin:0;max-width:66ch}
.plate{max-width:840px;background:var(--plate);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
form{padding:20px;display:grid;gap:16px}
form:empty{display:none}
label.f,div.f{display:grid;gap:6px}
label.f>span,div.f>.hint:first-child{font-family:var(--silk);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
input[type=text],input[type=search],input[type=email],select{border:1px solid var(--line);background:var(--well);border-radius:8px;padding:10px 12px;width:100%;transition:border-color .15s,background .15s}
input:focus,select:focus{background:var(--plate);border-color:var(--amber)}
.choices{display:flex;gap:8px;flex-wrap:wrap}
.choices label{display:flex;gap:8px;align-items:center;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--well)}
.choices label:has(input:checked){border-color:var(--ink);background:var(--plate)}
.choices input{accent-color:var(--amber);margin:0}
.results{display:grid;gap:4px;max-height:260px;overflow-y:auto}
.results button{text-align:left;background:var(--well);border:1px solid var(--line-2);border-radius:8px;padding:9px 12px;cursor:pointer;display:grid;gap:2px}
.results button:hover{border-color:var(--amber)}
.results small{color:var(--mute)}
.picked{background:var(--amber-soft);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.picked button{background:none;border:0;color:var(--ink);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.tag{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:4px;background:var(--line-2);color:var(--mute)}
.tag.archived{background:var(--rec-soft);color:var(--rec)}
.tag.draft{background:var(--amber-soft);color:var(--amber)}
.hint{color:var(--mute);font-size:13.5px}

/* --- transport: Preview arms, Do it records --- */
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line-2);margin:4px -20px -20px;padding:14px 20px;background:var(--well)}
form:not(:has(.f)) .actions{border-top:0;margin-top:-20px}
.btn{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--plate);border-radius:8px;padding:9px 16px 9px 13px;cursor:pointer;font-weight:600;box-shadow:var(--shadow);transition:transform .08s,border-color .15s}
.btn::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--amber)}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn:active:not(:disabled){transform:translateY(1px)}
#apply::before{background:var(--rec)}
#apply:not(:disabled){background:var(--rec);border-color:var(--rec);color:#fff}
#apply:not(:disabled)::before{background:#fff;box-shadow:0 0 0 3px rgb(255 255 255 / .25)}
#apply:not(:disabled):hover{background:var(--rec-glow);border-color:var(--rec-glow)}
.btn.primary:not(#apply){background:var(--ink);border-color:var(--ink);color:var(--plate)}
.btn.primary:not(#apply)::before{background:var(--go)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
#apply-hint{margin-left:4px}

/* --- log --- */
.log{max-width:840px;border-radius:12px;overflow:hidden;background:var(--tape);box-shadow:0 1px 2px rgb(0 0 0 / .15)}
.status{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid rgb(255 255 255 / .07);font-size:13px;color:var(--tape-dim)}
.status .hint{color:var(--tape-dim);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:7px;font-family:var(--silk);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--tape-fg)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:#3d4643}
.pill.run::before{background:var(--amber-glow);box-shadow:0 0 8px var(--amber-glow);animation:blink 1.1s ease-in-out infinite}
.pill.ok::before{background:#5fd08b;box-shadow:0 0 8px #5fd08b}
.pill.bad::before{background:var(--rec-glow);box-shadow:0 0 8px var(--rec-glow)}
@keyframes blink{50%{opacity:.35}}
.stop{margin-left:auto;background:none;border:1px solid rgb(255 255 255 / .18);border-radius:6px;padding:3px 10px;color:var(--tape-fg);cursor:pointer;font-size:12.5px}
.stop:hover{border-color:var(--rec-glow);color:var(--rec-glow)}
pre.out{color:var(--tape-fg);padding:14px 16px 18px;margin:0;min-height:180px;max-height:52vh;overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
pre.out.empty{color:var(--tape-dim)}
.error{color:var(--rec);margin:0}
@media (max-width:760px){.app{grid-template-columns:1fr;height:auto}aside{border-right:0;border-bottom:1px solid var(--line)}.quit{margin-top:0}}
@media (prefers-reduced-motion:reduce){.pill.run::before{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span class="mark">Squaredrum<br>Admin</span><span class="sub"><span class="led on"></span>Catalogue jobs · this Mac only</span></div>
    <nav id="nav" aria-label="Jobs"></nav>
    <button class="quit" id="quit" type="button">Close admin</button>
  </aside>
  <main>
    <p class="eyebrow" id="group"></p>
    <h1 id="title"></h1>
    <p class="what" id="what"></p>
    <div class="plate"><form id="form" autocomplete="off"></form></div>
    <section class="log" aria-label="Output">
      <div class="status"><span class="pill" id="pill">Ready</span><span class="hint" id="state"></span><button class="stop" id="stop" type="button" hidden>Stop</button></div>
      <pre class="out empty" id="out">Output appears here.</pre>
    </section>
  </main>
</div>

<script>
const TOKEN = "__TOKEN__";
const api = async (path, opts = {}) => {
  const r = await fetch(path, { ...opts, headers: { "x-admin-token": TOKEN, "content-type": "application/json" } });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || "Something went wrong.");
  return j;
};

let META = { labels: [], artists: [] };

// Each job: what the page shows and which fields it asks for. "preview" jobs show what would
// happen first; "Do it" only unlocks after a preview with the same values.
const JOBS = [
  { group: "New music", id: "import", title: "Import new music", what: "Brings new songs from a label's folders into the catalogue and uploads their covers. They stay hidden until New Music Friday (9 AM), when they go live everywhere with Drumroll. Preview lists the new files first, with anything that needs a second look flagged.", fields: ["label"], preview: true },
  { group: "Drumroll", id: "drumroll", title: "Build this Friday's Drumroll", what: "Builds the New Music Friday email from this week's releases (plus a spotlight artist, a moving Canvas, the channel and Off the Square). The words live in Drumroll/<date>/notes.md in your SQUARE BUSINESS folder: edit them and build again. Thursday's reminder builds it for you." },
  { group: "Drumroll", id: "drumrollsend", title: "Test or schedule Drumroll", what: "Preview shows the subject and send time. Type your email and press Do it to get a test copy; leave the box empty and press Do it to schedule it for the whole list at Friday 9 AM.", fields: ["test"], preview: true },
  { group: "New music", id: "friday", title: "Waiting for Friday", what: "Shows the albums imported this week that go live on Friday at 9 AM. \"Do it\" releases them right now instead; type an album or artist name to release just that one early.", fields: ["which"], preview: true },
  { group: "New music", id: "covers", title: "Upload covers", what: "Uploads new or changed album covers and single covers from your folders. Type an album name to do just that album: it takes seconds instead of checking the whole catalogue.", fields: ["album"], preview: true },
  { group: "New music", id: "playlists", title: "Curated playlists", what: "Loads the playlists in SQUARE BUSINESS/PLAYLISTS into GoSquare.", preview: true },
  { group: "Fix a song", id: "replace", title: "Replace a song's audio", what: "After you save a new version of a song over the old file, same name. The song keeps its likes, playlists and lyrics.", fields: ["song"], preview: true },
  { group: "Fix a song", id: "rename", title: "Rename a song", what: "Changes a song's title everywhere. The new title is remembered, so a later import keeps it.", fields: ["song", "newtitle"], preview: true },
  { group: "Fix a song", id: "status", title: "Archive or bring back", what: "Archive hides a song everywhere without deleting anything. Make live brings an archived song back, or switches on an alternate version that came in as a draft.", fields: ["song", "to"], preview: true },
  { group: "Fix a song", id: "explicit", title: "Explicit tags", what: "Reads the Explicit Finder tags on your song files and folders and updates the E badges.", preview: true },
  { group: "Lyrics & art", id: "lyrics", title: "Load lyrics", what: "Reads the Lyrics folders and loads new or changed lyric sheets.", preview: true },
  { group: "Lyrics & art", id: "sync", title: "Time lyrics to the music", what: "Listens to the songs and times each lyric line, so lyrics scroll in GoSquare. Takes about 40 seconds a song. Zulu and Xhosa songs can't be timed yet.", fields: ["who", "lang"], preview: true },
  { group: "Lyrics & art", id: "photos", title: "Artist photos & bio", what: "Uploads an artist's Photos folder and Press Kit (bio, Artist at a Glance) for their page on squaredrum.com.", fields: ["artist"], preview: true },
  { group: "Lyrics & art", id: "canvas", title: "Upload Canvas clips", what: "Finishes and uploads the Canvas clips saved in ~/Sites/canvas/raw.", preview: true },
  { group: "Artists", id: "instagram", title: "Instagram handle", what: "Sets or removes an artist's Instagram button on all three platforms. Leave the handle empty to remove it.", fields: ["artist", "handle"], preview: true },
  { group: "Artists", id: "hold", title: "Take off air / put back", what: "Takes an artist's music off the radio, GoSquare and squaredrum.com without deleting anything, or puts it back.", fields: ["artist", "action"], preview: true },
  { group: "Checks", id: "audit", title: "Catalogue check", what: "Reports titles that look like file names, duplicate songs, albums without covers or Canvas, and which artists are missing a bio or photos. Changes nothing." },
];

const nav = document.getElementById("nav");
const form = document.getElementById("form");
const out = document.getElementById("out");
const pill = document.getElementById("pill");
const stateEl = document.getElementById("state");
const stopBtn = document.getElementById("stop");
let active = null, picked = null, previewed = null, polling = null, seen = 0, jobId = null;

function renderNav() {
  const groups = [...new Set(JOBS.map((j) => j.group))];
  nav.innerHTML = "";
  for (const g of groups) {
    const box = document.createElement("div");
    box.className = "group";
    box.innerHTML = `<b>${g}</b>`;
    for (const j of JOBS.filter((x) => x.group === g)) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = j.title;
      b.onclick = () => choose(j.id);
      b.dataset.id = j.id;
      box.appendChild(b);
    }
    nav.appendChild(box);
  }
}

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const options = (list, current) => `<option value="">Choose…</option>` + list.map((x) => `<option value="${esc(x.slug)}" ${x.slug === current ? "selected" : ""}>${esc(x.name)}${x.held ? " (off air)" : ""}</option>`).join("");

function field(name) {
  switch (name) {
    case "label": return `<label class="f"><span>Label</span><select id="f-label" name="label" required>${options(META.labels)}</select></label>`;
    case "artist": return `<label class="f"><span>Artist</span><select id="f-artist" name="artist" required>${options(META.artists)}</select></label><div class="hint" id="artist-note"></div>`;
    case "song": return `<div class="f" id="song-box"></div>`;
    case "test": return `<label class="f"><span>Test address (leave empty to schedule for everyone)</span><input id="f-test" type="email" name="test" maxlength="200" placeholder="you@example.com"></label>`;
    case "which": return `<label class="f"><span>Album or artist (leave empty for everything waiting)</span><input id="f-which" type="text" name="which" maxlength="120" placeholder="e.g. Who Came Through"></label>`;
    case "album": return `<label class="f"><span>Album (leave empty to check every cover)</span><input id="f-album" type="text" name="album" maxlength="120" placeholder="e.g. Afro House Instrumentals Vol I"></label>`;
    case "newtitle": return `<label class="f"><span>New title</span><input id="f-title" type="text" name="title" required maxlength="120"></label>`;
    case "to": return `<div class="f"><span class="hint">Change it to</span><div class="choices"><label><input type="radio" name="to" value="archived" checked> Archive (hide everywhere)</label><label><input type="radio" name="to" value="released_radio"> Make live</label></div></div>`;
    case "who": return `<label class="f"><span>Artist or song title</span><input id="f-who" type="text" name="who" required placeholder="e.g. Fizz, or Usiku Huu"></label>`;
    case "lang": return `<label class="f"><span>Language the songs are sung in</span><select id="f-lang" name="lang"><option value="en">English (and most songs)</option><option value="sw">Swahili</option><option value="sn">Shona</option><option value="ln">Lingala</option><option value="fr">French</option><option value="pt">Portuguese</option><option value="es">Spanish</option><option value="yo">Yoruba</option></select></label>`;
    case "handle": return `<label class="f"><span>Instagram handle</span><input id="f-handle" type="text" name="handle" placeholder="e.g. saka.sq (no @)"></label>`;
    case "action": return `<div class="f"><span class="hint">Do</span><div class="choices"><label><input type="radio" name="action" value="hold" checked> Take off air</label><label><input type="radio" name="action" value="release"> Put back on air</label><label><input type="radio" name="action" value="list"> Just show who's off air</label></div></div>`;
  }
  return "";
}

function choose(id) {
  active = JOBS.find((j) => j.id === id);
  picked = null;
  previewed = null;
  for (const b of nav.querySelectorAll("button")) b.setAttribute("aria-current", String(b.dataset.id === id));
  document.getElementById("group").textContent = active.group;
  document.getElementById("title").textContent = active.title;
  document.getElementById("what").textContent = active.what;
  const buttons = active.preview
    ? `<div class="actions"><button class="btn" type="submit" id="preview">Preview</button><button class="btn primary" type="button" id="apply" disabled>Do it</button><span class="hint" id="apply-hint">Preview first to see what will change.</span></div>`
    : `<div class="actions"><button class="btn primary" type="submit" id="preview">Run</button></div>`;
  form.innerHTML = (active.fields ?? []).map(field).join("") + buttons;
  if ((active.fields ?? []).includes("song")) songBox();
  const artistSel = document.getElementById("f-artist");
  if (artistSel && active.id === "instagram") artistSel.onchange = () => {
    const a = META.artists.find((x) => x.slug === artistSel.value);
    document.getElementById("artist-note").textContent = a ? (a.instagram ? `Now: @${a.instagram}` : "No handle yet.") : "";
    document.getElementById("f-handle").value = a?.instagram ?? "";
  };
  form.oninput = form.onchange = () => lockApply();
  const applyBtn = document.getElementById("apply");
  if (applyBtn) applyBtn.onclick = () => run(true);
  try { localStorage.setItem("admin-job", id); } catch {}
}

function songBox() {
  const box = document.getElementById("song-box");
  if (picked) {
    box.innerHTML = `<span class="hint">Song</span><div class="picked"><span><b>${esc(picked.title)}</b> · ${esc(picked.artist ?? "label compilation")} · ${esc(picked.album ?? "")} <span class="tag ${esc(picked.status)}">${esc(picked.status.replace("_radio", ""))}</span></span><button type="button" id="repick">Change</button></div>`;
    document.getElementById("repick").onclick = () => { picked = null; lockApply(); songBox(); };
    return;
  }
  box.innerHTML = `<label class="f"><span>Find the song</span><input id="f-song" type="search" placeholder="Type part of the title or its SONG- code"></label><div class="results" id="results"></div>`;
  const input = document.getElementById("f-song");
  let t = null;
  input.oninput = () => {
    clearTimeout(t);
    t = setTimeout(async () => {
      const list = await api(`/api/songs?q=${encodeURIComponent(input.value)}`).catch(() => []);
      const res = document.getElementById("results");
      res.innerHTML = "";
      for (const s of list) {
        const b = document.createElement("button");
        b.type = "button";
        b.innerHTML = `<span><b>${esc(s.title)}</b> <span class="tag ${esc(s.status)}">${esc(s.status.replace("_radio", ""))}</span></span><small>${esc(s.artist ?? "label compilation")} · ${esc(s.album ?? "no album")} · ${esc(s.code)}</small>`;
        b.onclick = () => { picked = s; lockApply(); songBox(); };
        res.appendChild(b);
      }
      if (!list.length && input.value.trim().length >= 2) res.innerHTML = `<span class="hint">No songs match.</span>`;
    }, 250);
  };
  input.focus();
}

function values() {
  const fd = new FormData(form);
  const v = Object.fromEntries([...fd.entries()].filter(([k]) => k !== "f-song"));
  if (picked) v.song = picked.id;
  return v;
}

function lockApply() {
  previewed = null;
  const a = document.getElementById("apply");
  if (a) { a.disabled = true; document.getElementById("apply-hint").textContent = "Preview first to see what will change."; }
}

form.addEventListener("submit", (e) => { e.preventDefault(); run(false); });

async function run(apply) {
  const v = values();
  if ((active.fields ?? []).includes("song") && !picked) return say("Pick a song first.");
  if (apply && JSON.stringify(v) !== previewed) return say("The form changed since the preview. Preview again.");
  try {
    const { id } = await api("/api/run", { method: "POST", body: JSON.stringify({ name: active.id, form: v, apply }) });
    jobId = id;
    seen = 0;
    out.textContent = "";
    out.classList.remove("empty");
    if (!apply && active.preview) previewed = JSON.stringify(v);
    watch();
  } catch (e) {
    say(e.message);
  }
}

function say(msg) {
  out.textContent = msg;
  out.classList.remove("empty");
  pill.className = "pill bad";
  pill.textContent = "Not started";
}

function watch() {
  clearTimeout(polling);
  const tick = async () => {
    let j;
    try { j = await api(`/api/job?from=${seen}`); } catch { polling = setTimeout(tick, 1500); return; }
    if (!j) return;
    if (j.id !== jobId) { jobId = j.id; seen = 0; out.textContent = ""; return tick(); }
    if (j.lines.length) {
      const atBottom = out.scrollTop + out.clientHeight >= out.scrollHeight - 30;
      out.classList.remove("empty");
      out.textContent += (seen ? "\n" : "") + j.lines.join("\n");
      seen = j.total;
      if (atBottom) out.scrollTop = out.scrollHeight;
    }
    const what = j.apply ? "Doing it" : "Previewing";
    if (!j.done) {
      pill.className = "pill run"; pill.textContent = "Running"; stateEl.textContent = `${what}… you can leave this page open.`; stopBtn.hidden = false;
      polling = setTimeout(tick, 700);
      return;
    }
    stopBtn.hidden = true;
    pill.className = `pill ${j.ok ? "ok" : "bad"}`;
    const final = j.apply || !JOBS.find((x) => x.id === j.name)?.preview;
    pill.textContent = j.ok ? (final ? "Done" : "Preview ready") : "Stopped";
    stateEl.textContent = j.ok ? (final ? "Finished." : "Check the preview, then press Do it.") : "It stopped before finishing. The output above says why.";
    const a = document.getElementById("apply");
    if (a && !j.apply && j.ok && previewed && active?.id === j.name) { a.disabled = false; document.getElementById("apply-hint").textContent = "Runs it for real."; }
    if (j.apply && j.ok) { previewed = null; if (a) a.disabled = true; META = await api("/api/meta").catch(() => META); }
  };
  tick();
}

stopBtn.onclick = () => api("/api/stop", { method: "POST" }).catch(() => {});
document.getElementById("quit").onclick = async () => {
  await api("/api/quit", { method: "POST" }).catch(() => {});
  document.body.innerHTML = `<p style="padding:40px;font-family:var(--body)">Squaredrum Admin is closed. Open it again from the Desktop icon.</p>`;
};

(async () => {
  renderNav();
  let first = "import";
  try { first = localStorage.getItem("admin-job") || first; } catch {}
  choose(JOBS.some((j) => j.id === first) ? first : "import");
  // The label and artist lists come from the catalogue; redraw the form once they're here (nothing typed yet).
  try { META = await api("/api/meta"); } catch (e) { say(e.message); }
  if (!picked && !previewed) choose(active.id);
  const j = await api("/api/job").catch(() => null);
  if (j) { jobId = j.id; watch(); }
})();
</script>
</body>
